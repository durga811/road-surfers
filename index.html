<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Road Surfers — a 3D endless runner through a twilight megacity." />
    <meta name="theme-color" content="#070b18" />
    <title>Road Surfers</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b18'/%3E%3Cpath d='M20 50 L28 14 M32 50 L32 14 M44 50 L36 14' stroke='%234de3ff' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M12 40 Q22 30 32 40 T52 40' stroke='%238affd6' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- Colour / vignette grade layer -->
      <div class="grade" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <!-- ── HUD ─────────────────────────────────────────── -->
      <div class="hud" id="hud" aria-hidden="true">
        <div class="hud__top">
          <div class="stat stat--score">
            <span class="stat__label">Score</span>
            <span class="stat__value" id="hud-score">0</span>
          </div>
          <div class="stat stat--right">
            <div class="chip chip--coin">
              <svg viewBox="0 0 24 24" class="chip__icon" aria-hidden="true">
                <path d="M12 2 22 12 12 22 2 12Z" />
              </svg>
              <span id="hud-coins">0</span>
            </div>
            <div class="chip chip--dist">
              <span id="hud-distance">0</span><em>m</em>
            </div>
          </div>
        </div>

        <div class="hud__speed">
          <div class="speed__track"><div class="speed__fill" id="hud-speed"></div></div>
          <span class="speed__label">Velocity</span>
        </div>

        <div class="powerups" id="hud-powerups"></div>
        <div class="popups" id="hud-popups"></div>
      </div>

      <!-- ── Screens ─────────────────────────────────────── -->
      <div class="screen screen--start is-visible" id="screen-start">
        <div class="panel panel--title">
          <div class="brand">
            <svg class="brand__logo" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#4de3ff" />
                  <stop offset="1" stop-color="#8affd6" />
                </linearGradient>
              </defs>
              <!-- Three lanes converging to the horizon, and the surf line across them -->
              <path class="brand__lanes" d="M20 52 L28 12 M32 52 L32 12 M44 52 L36 12" />
              <path class="brand__wave" d="M10 40 Q21 29 32 40 T54 40" />
            </svg>
            <h1 class="brand__name">ROAD SURFERS</h1>
          </div>
          <p class="brand__tag">Endless transit run</p>

          <button class="btn btn--primary" id="btn-play" type="button">
            <span>Start Run</span>
          </button>

          <ul class="keys" aria-label="Controls">
            <li><kbd>A</kbd><kbd>D</kbd><span>Switch lane</span></li>
            <li><kbd>W</kbd><kbd>Space</kbd><span>Jump</span></li>
            <li><kbd>S</kbd><span>Slide</span></li>
            <li><kbd>Esc</kbd><span>Pause</span></li>
          </ul>

          <div class="best" id="start-best" hidden>Best <b>0</b></div>
        </div>
      </div>

      <div class="screen screen--pause" id="screen-pause">
        <div class="panel">
          <h2 class="panel__title">Paused</h2>
          <div class="panel__stats">
            <div><span>Score</span><b id="pause-score">0</b></div>
            <div><span>Distance</span><b id="pause-distance">0m</b></div>
          </div>
          <button class="btn btn--primary" id="btn-resume" type="button"><span>Resume</span></button>
          <button class="btn btn--ghost" id="btn-quit" type="button"><span>End Run</span></button>
        </div>
      </div>

      <div class="screen screen--over" id="screen-over">
        <div class="panel">
          <h2 class="panel__title" id="over-title">Run Ended</h2>
          <div class="finalscore"><span id="over-score">0</span></div>
          <div class="panel__stats">
            <div><span>Distance</span><b id="over-distance">0m</b></div>
            <div><span>Sparks</span><b id="over-coins">0</b></div>
            <div><span>Best</span><b id="over-best">0</b></div>
          </div>
          <button class="btn btn--primary" id="btn-retry" type="button"><span>Run Again</span></button>
          <button class="btn btn--ghost" id="btn-menu" type="button"><span>Main Menu</span></button>
          <p class="hint"><kbd>R</kbd> to restart</p>
        </div>
      </div>

      <div class="topbar">
        <button class="iconbtn iconbtn--pause" id="btn-pause" type="button" aria-label="Pause" title="Pause (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="iconbtn sound" id="btn-sound" type="button" aria-label="Toggle sound" title="Mute (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound__wave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
      </div>

      <div class="loading" id="loading"><div class="loading__bar"></div></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
